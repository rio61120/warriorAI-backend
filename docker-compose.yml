services:
  warriorai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warriorai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://warriorai:warriorai@postgres:5432/warriorai?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: warriorai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: warriorai
      POSTGRES_USER: warriorai
      POSTGRES_PASSWORD: warriorai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warriorai -d warriorai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: warriorai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
